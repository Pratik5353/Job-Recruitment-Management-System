{% extends "base.html" %}
{% block title %}Upload Resume — JobHub{% endblock %}
{% block content %}
<section class="mx-auto max-w-2xl px-5 py-12"><div class="glass-card"><p class="eyebrow">Resume</p><h1 class="section-title">Upload a resume</h1><form method="post" enctype="multipart/form-data" class="mt-8 space-y-5">{% csrf_token %}{% for field in form %}<div><label class="label">{{ field.label }}</label>{{ field }}</div>{% endfor %}<button class="btn-primary">Upload</button></form></div></section>
{% endblock %}
