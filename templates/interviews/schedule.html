{% extends "base.html" %}
{% block title %}Schedule Interview — JobHub{% endblock %}
{% block content %}
<section class="mx-auto max-w-2xl px-5 py-12"><div class="glass-card"><p class="eyebrow">Interview</p><h1 class="section-title">Schedule interview</h1><p class="mt-2 text-slate-400">{{ application.candidate.email }} · {{ application.job.title }}</p><form method="post" class="mt-8 space-y-5">{% csrf_token %}{% for field in form %}<div><label class="label">{{ field.label }}</label>{{ field }}</div>{% endfor %}<button class="btn-primary">Schedule</button></form></div></section>
{% endblock %}
